<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tompouce Hydra</title>
<!-- Token-holding parent shell. The companion token lives only in this
   document: it fetches code and analysis and forwards them to the tokenless
   eval frame below. Never move the token or an /api/tool call into the
   frame, and keep the sandbox attribute without allow-same-origin. -->
<style nonce="EDITOR_STYLE_NONCE">
 html,body{margin:0;height:100%;background:#090b12;color:#d7dbe2;font:13px system-ui,sans-serif;overflow:hidden}
 iframe{position:absolute;inset:0;border:0;width:100vw;height:100vh}
 #hud{position:fixed;top:8px;left:10px;padding:4px 8px;background:#101525aa;border:1px solid #2a3350;border-radius:6px;z-index:2}
 #source{position:fixed;left:10px;right:10px;bottom:10px;max-height:32vh;overflow:hidden;white-space:pre-wrap;font:12px/1.35 ui-monospace,monospace;color:#cbd5e1;background:#101525cc;border:1px solid #2a3350;border-radius:6px;padding:6px 8px;z-index:3;pointer-events:none}
</style></head><body>
<iframe id="frame" title="hydra" sandbox="allow-scripts" src="/hydra-frame.html"></iframe>
<div id="hud">waiting for engine analysis…</div>
<pre id="source"></pre>
<script nonce="EDITOR_STYLE_NONCE">
const token = 'COMPANION_TOKEN';
const frame = document.getElementById('frame');
const hud = document.getElementById('hud');
const sourcePanel = document.getElementById('source');
let lastSentGeneration = null, wantAnalyser = false, frameReady = false;
frame.addEventListener('load', () => { frameReady = true; lastSentGeneration = null; });
window.addEventListener('message', (event) => {
  if (event.source !== frame.contentWindow) return;
  const data = event.data;
  if (!data || typeof data.type !== 'string') return;
  if (data.type === 'hydra-status' && typeof data.hud === 'string')
    hud.textContent = data.hud;
  else if (data.type === 'hydra-flags')
    wantAnalyser = !!data.analyser;
});
async function callTool(name, args) {
  const reply = await fetch('/api/tool', {method:'POST',
    headers:{'Content-Type':'application/json','X-Companion-Token':token},
    body:JSON.stringify({name, arguments:args || {}})});
  if (!reply.ok) return null;
  const payload = await reply.json();
  const text = payload.result && payload.result.content && payload.result.content[0] && payload.result.content[0].text;
  return typeof text === 'string' ? text : null;
}
async function poll() {
  try {
    const scopeText = await callTool('music_audio_scope', {limit:192});
    if (scopeText) {
      const data = JSON.parse(scopeText);
      let code = null;
      if (typeof data.generation === 'number' && data.generation !== lastSentGeneration) {
        lastSentGeneration = data.generation;
        const codeText = await callTool('music_get_code', {});
        if (typeof codeText === 'string' && codeText.length <= 65536) {
          code = codeText;
          sourcePanel.textContent = codeText.length > 16000 ? codeText.slice(0,16000) + '\n…' : codeText;
          sourcePanel.style.display = codeText ? 'block' : 'none';
        }
      }
      let bands = null;
      if (wantAnalyser) {
        const spectrumText = await callTool('music_audio_spectrum', {});
        if (spectrumText) {
          try { bands = JSON.parse(spectrumText).bands || null; }
          catch (error) { bands = null; }
        }
      }
      if (frameReady) {
        frame.contentWindow.postMessage({type:'hydra-data',
          scope: data.scope || [], bands: bands,
          bpm: data.bpm, playing: data.playing,
          generation: typeof data.generation === 'number' ? data.generation : null,
          code: code}, '*');
      }
    }
  } catch (error) { /* keep the last frame on a dropped poll */ }
  setTimeout(poll, 125); // bounded to 8 Hz for analysis; rendering stays on rAF
}
poll();
</script></body></html>
