<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tompouce Hydra frame</title>
<!-- Tokenless eval sandbox. This document must never contain the companion
   token or call /api/tool: the parent fetches code and analysis over its
   own connection and forwards them with postMessage. Embed only with
   sandbox="allow-scripts" (opaque origin, no allow-same-origin). -->
<style nonce="EDITOR_STYLE_NONCE">
 html,body{margin:0;height:100%;background:#090b12;overflow:hidden}
 canvas{position:absolute;inset:0;display:block;width:100vw;height:100vh}
</style></head><body>
<canvas id="scope" width="960" height="540"></canvas>
<canvas id="stage" width="960" height="540"></canvas>
<script nonce="EDITOR_STYLE_NONCE" src="/patterns.js"></script>
<script nonce="EDITOR_STYLE_NONCE" src="/hydra.js"></script>
<script nonce="EDITOR_STYLE_NONCE">
const stage = document.getElementById('stage');
const scopeCanvas = document.getElementById('scope');
const ctx = scopeCanvas.getContext('2d');
let phase = 0, last = null, sourceGeneration = null;
let loadedCode = null, codeGeneration = null, codeError = null;
let renderError = null, analyserEnabled = false, feedEnabled = false;
let cycle = 0, cycleMs = 0, lastHud = '', lastFlags = '';
const musicStub = new Proxy(function(){ return musicStub; }, {
  get(target, property) {
    if (property === Symbol.toPrimitive) return () => 0;
    if (property === 'then' || typeof property === 'symbol') return undefined;
    return musicStub;
  },
});

/* Hydra's analyser object. detectAudio feeds it from the engine's bounded
   spectrum instead of a microphone so the visualizer never asks for device
   permission and the desktop engine stays the only audio source. */
const analyser = {
  fft: [], bins: [], settings: [], cutoff: 0, scale: 1, smooth: .4, isDrawing: false,
  setBins(count) {
    const n = Math.max(1, Math.min(64, Math.floor(Number(count) || 4)));
    this.fft = Array(n).fill(0);
    this.bins = Array(n).fill(0);
    this.settings = Array.from({length:n}, () => ({
      cutoff:this.cutoff, scale:this.scale, smooth:this.smooth}));
    for (let i=0;i<n;i++)
      globalThis['a'+i] = (scale=1, offset=0) => () => (analyser.fft[i] * scale + offset);
    return this;
  },
  setCutoff(value) {
    const n = Number(value);
    if (!Number.isFinite(n)) return this;
    this.cutoff = n;
    for (const setting of this.settings) setting.cutoff = n;
    return this;
  },
  setSmooth(value) {
    const n = Math.max(0, Math.min(.99, Number(value)));
    if (!Number.isFinite(n)) return this;
    this.smooth = n;
    for (const setting of this.settings) setting.smooth = n;
    return this;
  },
  setScale(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return this;
    this.scale = n;
    for (const setting of this.settings) setting.scale = n;
    return this;
  },
  setMax() { return this; },
  show() { this.isDrawing = true; return this; },
  hide() { this.isDrawing = false; return this; },
};
analyser.setBins(4);
globalThis.a = analyser;

/* Strudel-style feeding canvas: src(s0) samples the live scope when the
   source asks for feedStrudel. The terminal draws its own inline images;
   this canvas is the browser-side equivalent for Hydra. */
const feedCanvas = document.createElement('canvas');
feedCanvas.width = 512; feedCanvas.height = 288;
const feedCtx = feedCanvas.getContext('2d');
function drawFeed(samples, now) {
  const width = feedCanvas.width, height = feedCanvas.height;
  feedCtx.fillStyle = 'rgba(7,9,16,.28)';
  feedCtx.fillRect(0,0,width,height);
  feedCtx.strokeStyle = '#1d2740';
  feedCtx.lineWidth = 1;
  for (let i=1;i<4;i++) {
    const x = width*i/4;
    feedCtx.beginPath(); feedCtx.moveTo(x,0); feedCtx.lineTo(x,height); feedCtx.stroke();
  }
  if (!samples.length) return;
  let energy = 0;
  for (const value of samples) energy += Math.abs(value);
  energy = energy / samples.length;
  const hue = (now * .02 + energy * 80) % 360;
  feedCtx.strokeStyle = `hsl(${hue} 85% 65%)`;
  feedCtx.lineWidth = 2.5;
  feedCtx.beginPath();
  for (let i=0;i<samples.length;i++) {
    const x = i/(samples.length-1)*width;
    const y = height*.5 - Number(samples[i]||0)*height*.42;
    if (i===0) feedCtx.moveTo(x,y); else feedCtx.lineTo(x,y);
  }
  feedCtx.stroke();
}
function attachFeed() {
  if (feedEnabled) return;
  feedEnabled = true;
  if (globalThis.s0 && typeof globalThis.s0.init === 'function')
    globalThis.s0.init({src:feedCanvas});
}

const visualBase = Object.create(null);
visualBase.initHydra = async (options={}) => {
  if (options && options.detectAudio) analyserEnabled = true;
  if (options && options.feedStrudel) attachFeed();
  return globalThis.Hydra || visualBase;
};
visualBase.H = (pattern) => globalThis.TompouceHydraPatterns
  ? globalThis.TompouceHydraPatterns.H(pattern) : (() => 0);
visualBase.hush = () => globalThis.Hydra && globalThis.Hydra.hush ? globalThis.Hydra.hush() : undefined;
visualBase.setResolution = (width,height) => globalThis.Hydra && Hydra.setResolution ? globalThis.Hydra.setResolution(width,height) : undefined;
visualBase.render = () => undefined;
visualBase.setFunction = () => undefined;
const visualScope = new Proxy(visualBase, {
  has: () => true,
  get(target, property) {
    if (typeof property === 'symbol' || property === 'then') return undefined;
    if (Object.prototype.hasOwnProperty.call(target, property)) return target[property];
    if (property in globalThis) return globalThis[property];
    return musicStub;
  },
});
async function evaluateVisualCode(code) {
  const cleaned = String(code).replace(/(^|\n)[ \t]*\$:/g, '$1;');
  const runner = new Function('scope',
    'with(scope){return (async()=>{' + cleaned + '\n})()}');
  await runner(visualScope);
}
function showScope(on) {
  stage.style.display = on ? 'none' : 'block';
  scopeCanvas.style.display = on ? 'block' : 'none';
}
function drawScope(samples) {
  const width = scopeCanvas.width, height = scopeCanvas.height;
  ctx.fillStyle = '#090b12'; ctx.fillRect(0,0,width,height);
  let energy = 0;
  for (const value of samples) energy += Math.abs(value);
  energy = samples.length ? energy / samples.length : 0;
  phase += 0.01 + Math.min(0.06, energy * 0.4);
  ctx.strokeStyle = `hsl(${(phase*40)%360} 80% 65%)`; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i=0;i<samples.length;i++) {
    const x = samples.length>1 ? i/(samples.length-1)*width : 0;
    const y = height/2 - samples[i]*height*0.85;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.strokeStyle = '#2a3350'; ctx.beginPath();
  ctx.moveTo(0,height/2); ctx.lineTo(width,height/2); ctx.stroke();
  return energy;
}
function updateAnalyser(bands) {
  if (!Array.isArray(bands) || !bands.length || !analyser.fft.length) return;
  const count = analyser.fft.length;
  const spacing = Math.max(1, Math.floor(bands.length / count));
  const previous = analyser.bins.slice();
  for (let i=0;i<count;i++) {
    let sum = 0, weight = 0;
    for (let j=i*spacing;j<Math.min(bands.length,(i+1)*spacing);j++) {
      const db = Number(bands[j]);
      sum += Number.isFinite(db) ? Math.max(0, Math.min(1, (db + 70) / 60)) : 0;
      weight++;
    }
    const value = weight ? sum / weight : 0;
    const setting = analyser.settings[i] || {cutoff:analyser.cutoff,scale:analyser.scale,smooth:analyser.smooth};
    const mixed = value * (1 - setting.smooth) + (previous[i] || 0) * setting.smooth;
    analyser.bins[i] = mixed;
    analyser.fft[i] = Math.max(0, (mixed - setting.cutoff) / Math.max(.0001, setting.scale));
  }
}
function reportStatus() {
  let hud;
  if (globalThis.__hydraOutput && typeof __hydraOutput._render === 'function') {
    hud = renderError ? 'hydra: ' + renderError
      : 'hydra: WebGL graph · ' + (last && last.bpm ? last.bpm.toFixed(1) + ' bpm' : 'waiting');
  } else {
    const samples = last && last.scope ? last.scope : [];
    hud = last
      ? `hydra: ${last.playing ? 'playing' : 'stopped'} · ${Number(last.bpm||0).toFixed(1)} bpm · ${samples.length} samples`
      : (codeError ? 'hydra code: ' + codeError
        : globalThis.Hydra && Hydra.error ? 'hydra: ' + Hydra.error : 'waiting for engine analysis…');
  }
  if (hud !== lastHud) {
    lastHud = hud;
    window.parent.postMessage({type:'hydra-status', hud,
      codeError: codeError ? String(codeError) : null,
      renderError: renderError ? String(renderError) : null,
      hasOutput: !!(globalThis.__hydraOutput && typeof __hydraOutput._render === 'function')}, '*');
  }
  const flags = analyserEnabled + ':' + feedEnabled;
  if (flags !== lastFlags) {
    lastFlags = flags;
    window.parent.postMessage({type:'hydra-flags',
      analyser: analyserEnabled, feed: feedEnabled}, '*');
  }
}
window.addEventListener('message', async (event) => {
  /* Only the embedding parent may drive this frame. The sandbox gives this
     document an opaque origin, so event.origin is "null": authenticate by
     source instead, and never fetch or exfiltrate anything in return. */
  if (event.source !== window.parent) return;
  const data = event.data;
  if (!data || data.type !== 'hydra-data') return;
  if (typeof data.generation === 'number') {
    if (sourceGeneration !== null && data.generation !== sourceGeneration) {
      last = null; phase = 0; cycle = 0; cycleMs = 0; // new source: drop stale visual time
    }
    sourceGeneration = data.generation;
  }
  last = data;
  if (Array.isArray(data.bands)) updateAnalyser(data.bands);
  if (typeof data.code === 'string' && data.generation !== codeGeneration) {
    codeGeneration = data.generation;
    loadedCode = data.code;
    codeError = null;
    globalThis.__hydraCodeError = null;
    try { await evaluateVisualCode(data.code); }
    catch (error) {
      codeError = error && error.message ? error.message : String(error);
      globalThis.__hydraCodeError = codeError;
    }
  }
  reportStatus();
});
function frame(now) {
  requestAnimationFrame(frame);
  const bpm = last && Number.isFinite(last.bpm) && last.bpm > 0 ? last.bpm : 120;
  const dt = cycleMs ? Math.min(.25, Math.max(0, (now - cycleMs) / 1000)) : 0;
  cycleMs = now;
  cycle += dt * bpm / 240;
  if (globalThis.TompouceHydraPatterns) TompouceHydraPatterns.setCycle(cycle);
  if (feedEnabled) drawFeed(last && last.scope ? last.scope : [], now);
  const output = globalThis.__hydraOutput;
  if (output && typeof output._render === 'function') {
    showScope(false);
    try {
      output._render(last && last.scope ? last.scope : [], now);
      renderError = null;
    } catch (error) {
      renderError = error && error.message ? error.message : 'render error';
      showScope(true);
    }
  } else {
    showScope(true);
    drawScope(last && last.scope ? last.scope : []);
  }
  reportStatus();
}
requestAnimationFrame(frame);
</script></body></html>
