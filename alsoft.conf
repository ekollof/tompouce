# Tompouce-specific OpenAL Soft settings. This file sits next to the
# executable, so it applies only to this application and never changes the
# user's global ~/.config/alsoft.conf.
[general]
# OpenAL's default 512-frame update period is too coarse for the engine's
# low-latency queue. 64 frames at 48 kHz is 1.3 ms per update.
period_size = 64
periods = 2
channels = stereo
